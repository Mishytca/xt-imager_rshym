name: Python application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install flake8 pytest pyserial

      - name: Lint with flake8
        run: |
          # Stop on Python syntax errors and undefined names.
          flake8 . --count --select=E9,F63,F7,F82 \
            --show-source --statistics

          # Check code style and complexity.
          flake8 . --count --max-complexity=12 \
            --max-line-length=120 --statistics

      - name: Test with pytest
        run: |
          pytest
